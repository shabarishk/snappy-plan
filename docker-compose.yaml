version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: snappyplan
    volumes:
      # Maps the database to Unraid's persistent appdata share
      - /mnt/user/appdata/snappyplan/db:/var/lib/postgresql/data
      # PostgreSQL runs these scripts automatically when initializing an empty data directory.
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
      - ./migrations/000002_add_user_roles.up.sql:/docker-entrypoint-initdb.d/002_add_user_roles.sql:ro
      - ./migrations/000003_create_sessions_table.up.sql:/docker-entrypoint-initdb.d/003_create_sessions_table.sql:ro
      - ./migrations/000004_add_task_state.up.sql:/docker-entrypoint-initdb.d/004_add_task_state.sql:ro
      - ./migrations/000005_replace_task_position_with_priority.up.sql:/docker-entrypoint-initdb.d/005_replace_task_position_with_priority.sql:ro
      - ./migrations/000006_use_username_as_user_id.up.sql:/docker-entrypoint-initdb.d/006_use_username_as_user_id.sql:ro
      - ./migrations/000007_create_board_members.up.sql:/docker-entrypoint-initdb.d/007_create_board_members.sql:ro
      - ./migrations/000008_create_initiatives.up.sql:/docker-entrypoint-initdb.d/008_create_initiatives.sql:ro

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:8080"
    environment:
      # Set COOKIE_SECURE=true when serving the app over HTTPS.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # The Go app connects using the Docker service name 'db' instead of 'localhost'
      - DATABASE_URL=postgres://postgres:your_secure_password@db:5432/snappyplan?sslmode=disable
    depends_on:
      - db
