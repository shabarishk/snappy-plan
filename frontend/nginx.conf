server {
    listen 80;
    
    # Serve the React app
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Crucial for React Router (if added later) to not return 404s
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Go backend container
    location /api/ {
        # 'backend' matches the service name in docker-compose
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}