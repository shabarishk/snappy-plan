name: Auto-Approve Admin PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    # Restrict this workflow so it only runs for your exact GitHub username
    if: github.actor == 'shabarishk' 
    permissions:
      pull-requests: write
    steps:
      - name: Approve Pull Request
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.AUTO_APPROVE_TOKEN }}