name: PR Build Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check Frontend Test Coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Update to match your go.mod version

      - name: Check Backend Test Coverage
        run: |
          # Run tests and output coverage profile
          go test -coverprofile=coverage.out ./...
          
          # Extract the total coverage percentage
          COVERAGE=$(go tool cover -func=coverage.out | grep total | grep -Eo '[0-9]+\.[0-9]+')
          echo "Total Coverage: $COVERAGE%"
          
          # Evaluate if coverage is below 75%
          awk -v cov="$COVERAGE" 'BEGIN { 
            if (cov < 75.0) { 
              print "Error: Coverage " cov "% is strictly below the 75% threshold."; 
              exit 1; 
            } 
          }'

      - name: Build Docker Compose
        run: docker compose -f docker-compose.yaml build