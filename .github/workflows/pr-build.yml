name: PR Build Check

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'migrations/**'
              - 'queries/**'
              - 'sqlc.yaml'
            frontend:
              - 'frontend/src/**'
              - 'frontend/tests/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/vite.config.ts'
              - 'frontend/tsconfig*.json'
            app:
              - '.dockerignore'
              - 'Dockerfile'
              - 'docker-compose.yaml'
              - 'backend/**/*.go'
              - 'cmd/**/*.go'
              - 'dbgen/**/*.go'
              - 'frontend/src/**'
              - 'frontend/public/**'
              - 'frontend/index.html'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/vite.config.ts'
              - 'frontend/tsconfig*.json'
              - 'go.mod'
              - 'go.sum'
              - 'migrations/**'
              - 'queries/**'
              - 'sqlc.yaml'

  frontend-test-coverage:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Check Frontend Test Coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install diff-cover
        run: python -m pip install diff-cover

      - name: Check changed-line coverage
        run: |
          sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/lcov.info
          diff-cover frontend/coverage/lcov.info --compare-branch="origin/${BASE_REF}" --fail-under=75
        env:
          BASE_REF: ${{ github.base_ref }}

  backend-test-coverage:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate database access code
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: Run backend tests with coverage
        run: go test -coverprofile=coverage.out -coverpkg=./backend/...,./cmd/...,./dbgen/... ./backend/... ./cmd/... ./dbgen/...

      - name: Convert Go coverage to Cobertura
        run: |
          go install github.com/boumenot/gocover-cobertura@v1.5.0
          gocover-cobertura -strict -ignore-non-code-lines < coverage.out > coverage.xml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install diff-cover
        run: python -m pip install diff-cover

      - name: Check changed-line coverage
        run: diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=75
        env:
          BASE_REF: ${{ github.base_ref }}

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Compose
        run: docker compose -f docker-compose.yaml build
