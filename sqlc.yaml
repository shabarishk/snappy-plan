version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/000001_init_schema.up.sql"
      - "migrations/000002_add_user_roles.up.sql"
      - "migrations/000003_create_sessions_table.up.sql"
      - "migrations/000004_add_task_state.up.sql"
      - "migrations/000005_replace_task_position_with_priority.up.sql"
      - "migrations/000006_use_username_as_user_id.up.sql"
      - "migrations/000007_create_board_members.up.sql"
      - "migrations/000008_create_initiatives.up.sql"
      - "migrations/000009_add_profile_picture.up.sql"
      - "migrations/000010_add_preferred_name.up.sql"
      - "migrations/000011_personal_boards.up.sql"
    queries: "queries/"
    gen:
      go:
        package: "dbgen"
        out: "dbgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true