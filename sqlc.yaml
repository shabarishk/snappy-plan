version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/000001_init_schema.up.sql"
    queries: "queries/"
    gen:
      go:
        package: "dbgen"
        out: "dbgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true